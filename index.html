
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor Cosmetics</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #ff8fc7, #f6c1dc);
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 38px;
      color: white;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    header p {
      color: white;
      margin-top: 8px;
      font-size: 17px;
    }

    .hero {
      text-align: center;
      padding: 45px 20px;
    }

    .hero h2 {
      color: #d63384;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      font-size: 16px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      border-radius: 12px;
      background: #fff;
    }

    .product h3 {
      margin-top: 15px;
      color: #d63384;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
    }

    .btn {
      display: inline-block;
      background: #d63384;
      color: white;
      padding: 11px 22px;
      border-radius: 25px;
      text-decoration: none;
      margin-top: 5px;
    }

    .btn:hover {
      background: #b51f68;
    }

    footer {
      margin-top: 40px;
      background: #d63384;
      color: white;
      text-align: center;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>✨ Noor Cosmetics ✨</h1>
    <p>Beauty • Care • Confidence</p>
  </header>

  <section class="hero">
    <h2>Welcome to Noor Cosmetics</h2>
    <p>Discover beautiful cosmetics and skincare products.</p>
  </section>

  <section class="products">

    <div class="product">
      <img src="https://via.placeholder.com/400x400?text=Cosmetic+Product" alt="Cosmetic Product">
      <h3>Cosmetic Product</h3>
      <div class="price">Rs. 500</div>
      <a class="btn" href="#">Order Now</a>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/400x400?text=Beauty+Product" alt="Beauty Product">
      <h3>Beauty Product</h3>
      <div class="price">Rs. 700</div>
      <a class="btn" href="#">Order Now</a>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/400x400?text=Premium+Product" alt="Premium Product">
      <h3>Premium Product</h3>
      <div class="price">Rs. 3500</div>
      <a class="btn" href="#">Order Now</a>
    </div>

  </section>

  <footer>
    <p>© 2026 Noor Cosmetics — All Rights Reserved</p>
  </footer>

</body>
</html>
